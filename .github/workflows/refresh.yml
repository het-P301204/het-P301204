name: refresh record

# Keeps the chart honest without me touching it. Pulls the live repository
# list, dates and language mix from the GitHub API, rebuilds the SVGs, and
# commits only if something actually changed.

on:
  schedule:
    - cron: "17 5,17 * * *"   # twice daily, so a new repo lands within hours
  workflow_dispatch:          # and on demand from the Actions tab
  push:
    paths:
      - "record.json"
      - "build.mjs"
      - "sync.mjs"

permissions:
  contents: write

concurrency:
  group: refresh-record
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Sync from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node sync.mjs

      - name: Rebuild assets
        run: node build.mjs

      # A repo with no recognised topics is left off the profile rather than
      # guessed at. Say so out loud instead of failing silently.
      - name: Flag anything that could not classify itself
        if: hashFiles('unclassified.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(node -e '
            const fs=require("fs");
            const rows=fs.readFileSync("unclassified.txt","utf8").trim().split("\n").map(l=>l.split("|"));
            console.log("These repositories are not on the profile because nothing in `record.json` `topicMap` matched their topics:\n");
            for(const [name,topics] of rows) console.log(`- **${name}** — topics: ${topics||"_none set_"}`);
            console.log("\nFix either way:\n");
            console.log("1. Add a recognised topic to the repository (preferred — it then classifies itself), or");
            console.log("2. Add it to `map` in `record.json` for an explicit override.\n");
            console.log("This issue closes itself once every repository classifies.");
          ')
          EXISTING=$(gh issue list --state open --label unclassified --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Unclassified repositories are missing from the profile" \
                            --label unclassified --body "$BODY"
          fi

      - name: Close the flag once everything classifies
        if: hashFiles('unclassified.txt') == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --state open --label unclassified --json number --jq '.[].number'); do
            gh issue comment "$n" --body "Everything classifies now. Closing."
            gh issue close "$n"
          done

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refresh record ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main
          git push
