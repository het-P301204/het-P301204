name: refresh record

# Keeps the chart honest without me touching it. Pulls the live repository
# list, topics, dates, language mix, test counts and commits from the GitHub
# API, rebuilds the SVGs, and commits only if something actually changed.
#
# ORDERING MATTERS. The commit runs before the reporting steps, and the
# reporting steps cannot fail the job. A cosmetic notification once took the
# whole refresh down and froze the profile for five days while four
# repositories shipped — the useful work now lands first, unconditionally.

on:
  schedule:
    - cron: "17 5,17 * * *"   # twice daily, so a new repo lands within hours
  workflow_dispatch:          # and on demand from the Actions tab
  push:
    paths:
      - "record.json"
      - "build.mjs"
      - "sync.mjs"

permissions:
  contents: write
  issues: write               # the flagging steps open/close an issue

concurrency:
  group: refresh-record
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Sync from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node sync.mjs

      - name: Rebuild assets
        run: node build.mjs

      # First, and allowed to fail nothing. This is the actual job.
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refresh record ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main
          git push

      # Everything below is reporting. It runs after the profile is already
      # updated and is explicitly non-fatal.
      - name: Flag anything that could not classify itself
        if: always() && hashFiles('unclassified.txt') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(node report-unclassified.mjs)
          EXISTING=$(gh issue list --state open --label unclassified --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Unclassified repositories are missing from the profile" \
                            --label unclassified --body "$BODY"
          fi

      - name: Close the flag once everything classifies
        if: always() && hashFiles('unclassified.txt') == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --state open --label unclassified --json number --jq '.[].number'); do
            gh issue comment "$n" --body "Everything classifies now. Closing."
            gh issue close "$n"
          done
